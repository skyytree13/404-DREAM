
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404DREAM</title>
  <style>
    :root {
      --bg: #09091b;
      --panel: #15142d;
      --purple: #a995ff;
      --pink: #f0b9ff;
      --text: #eeeaff;
      --muted: #8e8aa9;
      --line: #51477e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 0%, #29204e 0%, transparent 55%),
        var(--bg);
      font-family: "Courier New", monospace;
      padding: 24px 14px 40px;
      image-rendering: pixelated;
    }

    .window {
      max-width: 760px;
      margin: 0 auto;
      border: 2px solid var(--purple);
      background: rgba(12, 12, 32, .96);
      box-shadow: 7px 7px 0 #050510, 0 0 25px #6e50a533;
    }

    .titlebar {
      padding: 12px 15px;
      background: #292044;
      border-bottom: 2px solid var(--purple);
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--pink);
      font-size: 13px;
      letter-spacing: 1px;
    }

    .window-buttons { letter-spacing: 5px; }

    header {
      text-align: center;
      padding: 34px 16px 18px;
    }

    .moon {
      color: var(--pink);
      font-size: 27px;
      margin-bottom: 10px;
    }

    h1 {
      color: var(--purple);
      font-size: clamp(30px, 7vw, 48px);
      letter-spacing: 5px;
      margin: 0;
      text-shadow: 3px 3px #473366;
    }

    .subtitle {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 2px;
      margin-top: 12px;
    }

    .divider {
      height: 2px;
      background: var(--line);
      margin: 0 20px;
    }

    .owner-label {
      color: var(--muted);
      text-align: center;
      font-size: 11px;
      letter-spacing: 3px;
      margin: 24px 0 8px;
    }

    .noise {
      color: var(--pink);
      letter-spacing: 2px;
    }

    /* 한 명만 보이도록 이미지 영역을 자르는 창 */
    .character-frame {
      width: 190px;
      height: 230px;
      margin: 12px auto 8px;
      overflow: hidden;
      position: relative;
      border: 2px solid var(--line);
      background: #111129;
      box-shadow: 5px 5px 0 #070714;
    }

    .character-frame img {
      width: 300%;
      height: 100%;
      max-width: none;
      object-fit: cover;
      object-position: center;
      position: absolute;
      left: -100%;
      top: 0;
      image-rendering: pixelated;
    }

    .image-caption {
      text-align: center;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 1px;
      margin: 12px 0 25px;
    }

    .dialogue-box {
      margin: 0 18px 22px;
      border: 2px solid var(--purple);
      background: var(--panel);
      padding: 16px;
      box-shadow: 4px 4px 0 #070714;
    }

    .speaker {
      color: var(--pink);
      font-size: 12px;
      margin-bottom: 12px;
      letter-spacing: 2px;
    }

    .dialogue-text {
      white-space: pre-line;
      line-height: 1.9;
      font-size: 14px;
      min-height: 52px;
      margin: 0 0 15px;
    }

    .choices {
      display: grid;
      gap: 9px;
    }

    button {
      font: inherit;
      cursor: pointer;
      color: var(--text);
      background: #211d40;
      border: 1px solid #7262ad;
      padding: 12px;
      text-align: left;
      transition: background .15s, transform .15s;
    }

    button:hover {
      background: #39305f;
      border-color: var(--pink);
      transform: translate(-1px, -1px);
    }

    .enter-button {
      display: block;
      width: 100%;
      text-align: center;
      color: var(--pink);
      margin-top: 14px;
    }

    .hidden { display: none; }

    footer {
      text-align: center;
      padding: 18px 8px 24px;
      color: #77718f;
      font-size: 10px;
      letter-spacing: 1px;
      line-height: 2;
    }

    @media (max-width: 420px) {
      .character-frame {
        width: 165px;
        height: 205px;
      }

      .dialogue-box { margin-inline: 12px; }
    }
  </style>
</head>
<body>
  <main class="window">
    <div class="titlebar">
      <span>☾ 404DREAM.exe</span>
      <span class="window-buttons">－ □ ×</span>
    </div>

    <header>
      <div class="moon">✦ ☾ ✦</div>
      <h1>404DREAM</h1>
      <div class="subtitle">A DREAM BY SKYTREE</div>
    </header>

    <div class="divider"></div>

    <p class="owner-label">
      OWNER · <span class="noise">▓▓▓▓▓▓</span>
    </p>

    <figure class="character-frame">
      <img
        src="file_000000005f7881fb82f973b750f3b793.jpg"
        alt="404DREAM의 보라색 머리 주인 캐릭터"
      >
    </figure>

    <p class="image-caption">
      UNKNOWN PROFILE · DATA PARTIALLY RECOVERED
    </p>

    <section class="dialogue-box">
      <div class="speaker" id="speaker">주인</div>

      <p class="dialogue-text" id="dialogue">어서 오세요.
오늘 힘드셨나 봐요. 괜찮으세요?</p>

      <div class="choices" id="choices">
        <button onclick="reply(0)">네, 조금 지쳤어요.</button>
        <button onclick="reply(1)">여기가 어디죠?</button>
        <button onclick="reply(2)">……</button>
        <button onclick="reply(3)">저 사람들은 누구예요?</button>
      </div>

      <button class="enter-button hidden" id="enter"
        onclick="location.href='menu.html'">
        [ 가게 안으로 들어가기 → ]
      </button>
    </section>

    <footer>
      YOU FOUND A PLACE THAT SHOULD NOT EXIST.<br>
      CONNECTION STATUS · UNKNOWN
    </footer>
  </main>

  <script>
    const responses = [
      "그렇군요. 그럼 오늘은 조금 쉬어 가세요.",
      "글쎄요. 지도를 드릴 수 있는 곳은 아니거든요.",
      "괜찮아요. 대답하지 않으셔도 돼요.",
      "손님들이에요. 다들 저마다의 이유로 찾아오셨죠."
    ];

    function reply(index) {
      document.getElementById("speaker").textContent = "주인";
      document.getElementById("dialogue").textContent =
        responses[index] +
        "\n\n들어오셔서, 드시고 싶은 메뉴를 주문해 주세요.\n행복하게 해드릴 자신 있으니까요!";

      document.getElementById("choices").classList.add("hidden");
      document.getElementById("enter").classList.remove("hidden");
    }
  </script>
</body>
</html>
